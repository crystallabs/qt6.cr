find_paths:
  QMAKE:
    kind: Executable
    optional: true
    try:
      - qmake6
      - qmake-qt*
      - qmake
    version:
      min: "6.0.0"
      max: "6.999.0" # Disallow Qt5 and Qt7
      variable: QT_VERSION
      command: "% -version"
      regex: "Using Qt version ([0-9.]+)"
    error_message: |
      You're missing Qt6 development files, please install these:
        ArchLinux: pacman -S qt6-base gc
        Ubuntu: apt install qt6-base-dev libgc-dev
        macOS: brew install qt bdw-gc
        Windows: https://www.qt.io/download-open-source/
        All Other: HELP WANTED!

      If you have installed Qt6 in a non-standard location:
        Automatic:
          1) Add `qmake6`, `qmake-qt6` or `qmake` to your $PATH.
          2) Or make QMAKE point to it
        Manual: Set these environment variables:
          QTDIR=/installation/prefix
          QT_INCLUDE_DIR=$QTDIR/include
          QT_LIBS_DIR=$QTDIR/libs
  QT_INCLUDE_DIR:
    try:
      # Best case: Ask QMake
      - shell: "{QMAKE} -query QT_INSTALL_HEADERS/get"
      # Qt built as macOS frameworks (like Homebrew's) keeps the headers in
      # `lib/QtCore.framework/Headers` etc., found through `-F` on the lib dir.
      - shell: "{QMAKE} -query QT_INSTALL_LIBS"
      # Fall back to guessing the path
      - "{QTDIR}/include"
      - "/usr/include/qt6"
      - "/usr/include/*/qt6"
      - "/usr/include"
      - "/usr/local/include/qt6"
      - "/usr/local/include/*/qt6"
      - "/usr/local/include"
    checks:
      # Check module directories
      - any_of:
          - { path: "QtCore", kind: "Directory" }
          - { path: "QtCore.framework", kind: "Directory" }
      - any_of:
          - { path: "QtGui", kind: "Directory" }
          - { path: "QtGui.framework", kind: "Directory" }
      - any_of:
          - { path: "QtWidgets", kind: "Directory" }
          - { path: "QtWidgets.framework", kind: "Directory" }
  QT_LIBS_DIR:
    try:
      - shell: "{QMAKE} -query QT_INSTALL_LIBS"
      - "{QTDIR}/lib"
      - "/usr/lib"
      - "/usr/lib64"
      - "/usr/local/lib"
    if_os_is_windows:
      checks:
        - path: Qt6Core.dll
        - path: Qt6Gui.dll
        - path: Qt6Widgets.dll
    if_os_is_linux:
      checks:
        - path: libQt6Core.so
        - path: libQt6Gui.so
        - path: libQt6Widgets.so
  EXT_INCLUDES:
    kind: Directory
    optional: false
    list:
      separator: " -I"
      template: "%"
    try:
      - "%/ext"
