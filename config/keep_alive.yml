# Methods taking ownership of, or keeping a pointer to, their arguments, which
# Qt then refers to from memory the GC doesn't scan.  Their wrappers pass these
# arguments to `BindgenHelper.keep_alive`, so the GC doesn't destroy objects Qt
# still uses.
# `release:` marks the methods handing such an object back, which Qt stops
# using without deleting it, like `QLayout::takeAt`: their wrappers pass the
# selected arguments, and the result when all are selected, to
# `BindgenHelper.release`.  An object isn't counted: releasing it lets the GC
# collect it even if another holder kept it too, so methods taking out an object
# commonly shared, like an action or an event filter, release nothing.  Neither
# can methods handing back nothing but an index, like `QTabWidget::removeTab`:
# `Qt::BindgenHelper.release(object)` lets the GC collect one by hand.
#
# `depends_on:` marks the constructors whose object uses an argument when
# destroyed, like an iterator unregistering from its container: the GC destroys
# the object before the argument, and releases the argument with it.  On a
# method, like `setDevice`, the call replaces the dependencies of the object.
#
# `parent_arguments:` names the constructor arguments giving an object its
# owner in the classes owned by a parent which aren't QObjects, like the tree
# or item of a QTreeWidgetItem: bindgen's `Qt` processor keeps the object alive
# while it has one, like a QObject's child.
#
# Deep-merged (`<<+:`) into `types:` after `deprecated.yml`, so classes listed
# in both keep their `ignore_methods` from there.
---
QLayout:
  keep_alive:
    "^addWidget$": true
    "^addItem$": true
    "^replaceWidget$": [1]
    "^setMenuBar$": true
    "^addChild(Widget|Layout)$": true # Protected, for layouts written in Crystal
  release:
    "^takeAt$": true # The result: an item given to addItem, or a layout; a widget stays kept with its QWidgetItem
    "^remove(Widget|Item)$": true
    "^replaceWidget$": [0]
QBoxLayout:
  keep_alive:
    "^(add|insert)(Widget|Layout|Item|SpacerItem)$": true
QGridLayout:
  keep_alive:
    "^add(Widget|Layout|Item)$": true
QFormLayout:
  keep_alive:
    "^(add|insert)Row$": true
    "^set(Widget|Layout|Item)$": true
    "^addItem$": true
QStackedLayout:
  keep_alive:
    "^(add|insert)Widget$": true
    "^addItem$": true
QObject:
  keep_alive:
    "^installEventFilter$": true
  # No release of removeEventFilter: a filter is often installed on several objects
QCoreApplication:
  keep_alive:
    "^postEvent$": [1]
    "^setEventDispatcher$": true
    "^installTranslator$": true
  release:
    "^removeTranslator$": true
QThread:
  keep_alive:
    "^setEventDispatcher$": true
QWidget:
  keep_alive:
    "^setLayout$": true
    "^addAction$": true
    "^insertAction$": [1]
    "^set(Style|GraphicsEffect|FocusProxy)$": true
  # No release of removeAction: an action is often in several widgets, like a menu and a toolbar
QApplication:
  keep_alive:
    "^setStyle$": true
QMainWindow:
  keep_alive:
    "^set(CentralWidget|MenuBar|MenuWidget|StatusBar)$": true
    "^addToolBar$": true
    "^insertToolBar$": [1]
    "^addDockWidget$": true
    "^(tabify|split)DockWidget$": [1]
    "^restoreDockWidget$": true
  release:
    "^takeCentralWidget$": true
    "^remove(ToolBar|DockWidget)$": true # Hidden, not deleted
QStatusBar:
  keep_alive:
    "^(add|insert)(Permanent)?Widget$": true
  release:
    "^removeWidget$": true
QTabWidget:
  keep_alive:
    "^addTab$": [0]
    "^insertTab$": [1]
    "^set(CornerWidget|TabBar)$": true
  # removeTab(int) hands back nothing: release the page by hand
QScrollArea:
  keep_alive:
    "^setWidget$": true
  release:
    "^takeWidget$": true
QAbstractScrollArea:
  keep_alive:
    "^set(Viewport|CornerWidget|HorizontalScrollBar|VerticalScrollBar)$": true
    "^addScrollBarWidget$": true
QDockWidget:
  keep_alive:
    "^set(Widget|TitleBarWidget)$": true
QMenuBar:
  keep_alive:
    "^setCornerWidget$": true
    "^addMenu$": [0]
    "^insertMenu$": [1]
QMenu:
  keep_alive:
    "^addMenu$": [0]
    "^insertMenu$": [1]
    "^setDefaultAction$": true
QAction: # setMenu is declared in types.yml: a template in Qt 6
  keep_alive:
    "^set(Menu|ActionGroup)$": true
QPushButton:
  keep_alive:
    "^setMenu$": true
QToolButton:
  keep_alive:
    "^set(Menu|DefaultAction)$": true
QButtonGroup:
  keep_alive:
    "^addButton$": true
  release:
    "^removeButton$": true
QSystemTrayIcon:
  keep_alive:
    "^setContextMenu$": true
QToolBar:
  keep_alive:
    "^addWidget$": true
    "^insertWidget$": [1]
QAbstractItemView:
  keep_alive:
    "^set(Model|SelectionModel|ItemDelegate|ItemDelegateForRow|ItemDelegateForColumn)$": true
    "^setIndexWidget$": [1]
QTableView:
  keep_alive:
    "^set(HorizontalHeader|VerticalHeader)$": true # The view owns its headers; setModel follows QAbstractItemView's rule
QStyledItemDelegate:
  keep_alive:
    "^setItemEditorFactory$": true
QListWidget:
  keep_alive:
    "^(add|insert)Item$": true
    "^setItemWidget$": [1]
  release:
    "^takeItem$": true # removeItemWidget deletes the widget
QListWidgetItem:
  parent_arguments: [listview] # The list given to the constructor owns the item
QTableWidget:
  keep_alive:
    "^set(Item|HorizontalHeaderItem|VerticalHeaderItem|CellWidget|ItemPrototype)$": true
  release:
    "^take(Item|HorizontalHeaderItem|VerticalHeaderItem)$": true # removeCellWidget deletes the widget
QComboBox:
  keep_alive:
    "^set(LineEdit|View|Model|ItemDelegate|Completer|Validator)$": true
QLineEdit:
  keep_alive:
    "^set(Completer|Validator)$": true
    "^addAction$": [0]
QCompleter:
  keep_alive:
    "^set(Model|Widget|Popup)$": true
    "^$": [0] # QCompleter(QAbstractItemModel *, QObject *) takes ownership of a parentless model
QFileDialog:
  keep_alive:
    "^set(ItemDelegate|IconProvider|ProxyModel)$": true
QLabel:
  keep_alive:
    "^set(Buddy|Movie)$": true
QTabBar:
  keep_alive:
    "^setTabButton$": [2]
QTextEdit:
  keep_alive:
    "^setDocument$": true
QDrag:
  keep_alive:
    "^setMimeData$": true
QClipboard:
  keep_alive:
    "^setMimeData$": [0]
QProcess:
  keep_alive:
    "^setStandardOutputProcess$": true
QGraphicsView:
  keep_alive:
    "^setScene$": true
QGraphicsScene:
  keep_alive:
    "^add(Item|Widget)$": [0]
    "^setStyle$": true
  release:
    "^removeItem$": true # The caller owns the item; a widget addWidget kept stays kept with its proxy
QGraphicsItem:
  keep_alive:
    "^installSceneEventFilter$": true
    "^set(GraphicsEffect|Group)$": true
QGraphicsItemGroup:
  keep_alive:
    "^addToGroup$": true
  # No release of removeFromGroup: the item stays in the scene of the group
QGraphicsProxyWidget:
  keep_alive:
    "^setWidget$": true
QGraphicsWidget:
  keep_alive:
    "^addAction$": true
    "^insertAction$": [1]
    "^set(Layout|Style)$": true
QGraphicsLinearLayout:
  keep_alive:
    "^addItem$": true
    "^insertItem$": [1]
  release:
    "^removeItem$": true
QGraphicsGridLayout:
  keep_alive:
    "^addItem$": [0]
  release:
    "^removeItem$": true
QGraphicsAnchorLayout:
  keep_alive:
    "^add(Anchor|CornerAnchors)$": [0, 2]
    "^addAnchors$": [0, 1]
QGraphicsItemAnimation:
  keep_alive:
    "^set(Item|TimeLine)$": true
QProxyStyle:
  keep_alive:
    "^setBaseStyle$": true
    "^$": true # QProxyStyle(QStyle *) takes ownership like setBaseStyle
QGraphicsTextItem:
  keep_alive:
    "^setDocument$": true
QStandardItemModel:
  keep_alive:
    "^appendRow$": true
    "^set(Item|HorizontalHeaderItem|VerticalHeaderItem|ItemPrototype)$": true
  release:
    "^take(Item|HorizontalHeaderItem|VerticalHeaderItem)$": true # takeRow and takeColumn return lists, which aren't released
QStandardItem:
  keep_alive:
    "^(append|insert)(Row|Rows|Column)$": true
    "^setChild$": true
  release:
    "^takeChild$": true # takeRow and takeColumn return lists, which aren't released
QAbstractProxyModel:
  keep_alive:
    "^setSourceModel$": true
QItemSelectionModel:
  keep_alive:
    "^setModel$": true
  depends_on:
    "^$": [0] # The model, not the parent
QAnimationGroup:
  keep_alive:
    "^addAnimation$": true
    "^insertAnimation$": [1]
  release:
    "^takeAnimation$": true
    "^removeAnimation$": true
QPropertyAnimation:
  keep_alive:
    "^setTargetObject$": true
    "^$": [0] # The target, not the parent
QTreeView:
  keep_alive:
    "^setHeader$": true
QTreeWidget:
  keep_alive:
    "^(add|insert)TopLevelItems?$": true
    "^setHeaderItem$": true
    "^setItemWidget$": [2]
  release:
    "^takeTopLevelItem$": true # removeItemWidget deletes the widget
QTreeWidgetItem:
  parent_arguments: [parent, treeview] # The tree or item given to the constructor owns the item, like a QObject parent
  keep_alive:
    "^(add|insert)Child(ren)?$": true
  release:
    "^takeChild$": true # takeChildren returns a list, which isn't released
    "^removeChild$": true
QDataWidgetMapper:
  keep_alive:
    "^set(Model|ItemDelegate)$": true
    "^addMapping$": [0]
  release:
    "^removeMapping$": true
QItemDelegate:
  keep_alive:
    "^setItemEditorFactory$": true
QPlainTextEdit:
  keep_alive:
    "^setDocument$": true
QAbstractTextDocumentLayout:
  keep_alive:
    "^setPaintDevice$": true
    "^registerHandler$": [1]
  release:
    "^unregisterHandler$": [1]
QSyntaxHighlighter:
  keep_alive:
    "^setDocument$": true
QTextBlock:
  keep_alive:
    "^setUserData$": true
QUndoCommand:
  parent_arguments: [parent] # A child command belongs to its parent command
QUndoStack:
  keep_alive:
    "^push$": true
QUndoGroup:
  keep_alive:
    "^addStack$": true
  release:
    "^removeStack$": true
QUndoView:
  keep_alive:
    "^set(Stack|Group)$": true
  depends_on:
    "^$": [0] # The stack or group, not the parent
QSplitter:
  keep_alive:
    "^addWidget$": true
    "^(insert|replace)Widget$": [1]
  # replaceWidget(int, QWidget *) returns the old widget, but a rule releasing the result releases the new one too: release it by hand
QWizard:
  keep_alive:
    "^addPage$": true
    "^set(Page|Button)$": [1]
    "^setSideWidget$": true
  # removePage(int) hands back nothing: release the page by hand
QWizardPage:
  keep_alive:
    "^registerField$": [1]
QDialogButtonBox:
  keep_alive:
    "^addButton$": true
  release:
    "^removeButton$": true
QMessageBox:
  keep_alive:
    "^setCheckBox$": true
    "^addButton$": [0]
    "^set(Default|Escape)Button$": true
  release:
    "^removeButton$": true
QMdiArea:
  keep_alive:
    "^addSubWindow$": [0]
  release:
    "^removeSubWindow$": true
QMdiSubWindow:
  keep_alive:
    "^set(Widget|SystemMenu)$": true
QToolBox:
  keep_alive:
    "^addItem$": [0]
    "^insertItem$": [1]
  # removeItem(int) hands back nothing: release the widget by hand
QFocusFrame:
  keep_alive:
    "^setWidget$": true
QProgressDialog:
  keep_alive:
    "^set(Bar|CancelButton|Label)$": true
QActionGroup:
  keep_alive:
    "^addAction$": true
QWidgetAction:
  keep_alive:
    "^setDefaultWidget$": true
QMovie:
  depends_on:
    "^setDevice$": true
    "^$": [0] # The device, not the parent
QImageReader:
  depends_on:
    "^setDevice$": true
    "^$": true # Reads or writes the device as long as it lives
QImageWriter:
  depends_on:
    "^setDevice$": true
    "^$": true # Reads or writes the device as long as it lives
QTextDocumentWriter:
  depends_on:
    "^setDevice$": true
    "^$": true
QSignalMapper:
  keep_alive:
    "^setMapping$": true
  release:
    "^removeMappings$": true # The sender; an object mapped to stays kept
QGestureRecognizer:
  keep_alive:
    "^registerRecognizer$": true
QXmlStreamReader:
  keep_alive:
    "^setEntityResolver$": true
  depends_on:
    "^setDevice$": true
    "^$": true # Reads the device as long as it lives
QXmlStreamWriter:
  depends_on:
    "^setDevice$": true
    "^$": true
QDataStream:
  depends_on:
    "^setDevice$": true
    "^$": true # Reads or writes the device as long as it lives
QBasicTimer:
  keep_alive:
    "^start$": true
QTextStream:
  depends_on:
    "^setDevice$": true
    "^$": true # The stream flushes to its device when destroyed.  (The read-only stream of a byte array copies it; depending on it is harmless)
QObjectCleanupHandler:
  keep_alive:
    "^add$": true
  release:
    "^remove$": true
QCborStreamReader:
  depends_on:
    "^setDevice$": true
    "^$": true # Reads or writes the device as long as it lives
QCborStreamWriter:
  depends_on:
    "^setDevice$": true
    "^$": true # Reads or writes the device as long as it lives
QConcatenateTablesProxyModel:
  keep_alive:
    "^addSourceModel$": true
  release:
    "^removeSourceModel$": true
QFileSystemModel:
  keep_alive:
    "^setIconProvider$": true
QItemEditorFactory:
  keep_alive:
    "^registerEditor$": [1]
    "^setDefaultFactory$": true
QIcon:
  keep_alive:
    "^$": true # QIcon(QIconEngine *) takes ownership of the engine
QStackedWidget:
  keep_alive:
    "^addWidget$": true
    "^insertWidget$": [1]
  release:
    "^removeWidget$": true
QColumnView:
  keep_alive:
    "^setPreviewWidget$": true
QAbstractSpinBox:
  keep_alive:
    "^setLineEdit$": true
QDateTimeEdit:
  keep_alive:
    "^setCalendarWidget$": true
QTextDocument:
  keep_alive:
    "^setDocumentLayout$": true
QGraphicsLayout:
  keep_alive:
    "^addChildLayoutItem$": true # Protected, for layouts written in Crystal
QGraphicsLayoutItem:
  keep_alive:
    "^setParentLayoutItem$": true
QAbstractEventDispatcher:
  keep_alive:
    "^registerTimer$": true # Unlike QObject::startTimer, nothing unregisters the object
QWidgetItem:
  depends_on:
    "^$": true # The item refers to its widget; QWidgetItemV2 inherits the rule
QBackingStore:
  depends_on:
    "^$": true # Paints into its window
QPdfWriter:
  depends_on:
    "^$": true # Writes to its device
QSemaphoreReleaser:
  depends_on:
    "^$": true # Releases its semaphore when destroyed
QItemSelectionRange:
  depends_on:
    "^$": true # Holds persistent indexes, which unregister from the model when destroyed, through the indexes it is made of
QItemSelection:
  depends_on:
    "^$": true
QTreeWidgetItemIterator:
  depends_on:
    "^$": true # The iterator unregisters from the model of its tree widget when destroyed; a copy depends on the iterator it copies
  ignore_methods: # Their by-value results are copies without a dependency; `TreeWidgetItemIterator#succ!` and `#pred!` use `operator+=` and `operator-=`
    - "operator++"
    - "operator--"
    - "operator=" # Retargets an iterator without updating its dependency
QPainter:
  depends_on:
    "^$": true # The painter ends painting on its device when destroyed
    "^begin$": true # And paints on the device given here instead
QPersistentModelIndex:
  depends_on:
    "^$": true # The index unregisters from its model when destroyed, reached through the model index it is made of
