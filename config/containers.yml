containers:
  - class: std::optional # Converted to and from a T?: FontComboBox#display_font
    type: Optional
  # Qt 6 has no separate QVector: it's an alias of QList.
  - class: QList
    type: Sequential
    instantiations:
      - [ "qreal" ]
      - [ "QRgb" ]
      - [ "QByteArray" ] # As Bytes, see types.yml
      - [ "int" ] # QVersionNumber#segments
  # Qt 6's QPair is an alias of std::pair, which the parser reports.  A pair
  # is converted to and from a Tuple: UrlQuery#query_items is an
  # Enumerable({String, String}), Gradient#stops an Enumerable({Float64,
  # Color}).  The pairs nested in the lists the methods use are instantiated
  # automatically.
  - class: std::pair
    type: Pair
  # The maps the methods use are instantiated automatically too, exchanged as
  # a Hash: StandardItemModel#item_data is a Hash(Int32, Variant),
  # AbstractItemModel#role_names a Hash(Int32, Bytes).
  - class: QMap
    type: Associative
    count_method: contains
    erase_method: remove
    insert_method: insert
  # QSet<T> is an Enumerable(T) with #includes?, #<<, #delete and #concat;
  # methods taking one accept any Enumerable.
  - class: QSet
    type: Set
    count_method: contains
    erase_method: remove
    instantiations: # No wrapped method uses a QSet; instantiated for the specs
      - [ "QString" ]
      - [ "int" ]
  - class: QHash
    type: Associative
    count_method: contains
    erase_method: remove
    insert_method: insert
