functions:
  "^qVersion$":
    destination: "::"
  "^qt6cr_reset_numeric_locale":
    destination: "::"
  "^qt6cr_xml_\\w+$": # See ext/xml_helper.hpp
    destination: "::"
  "^qt6cr_data_stream_\\w+$": # See ext/data_stream_helper.hpp
    destination: "::"
  "^qt6cr_invoke_method$": # See ext/meta_helper.hpp
    destination: "::"
  # The QTextStream manipulators taking an argument, as Qt.q_set_field_width
  # etc.: a TextStream << a TextStreamManipulator applies it.
  "^qSet(?:FieldWidth|PadChar|RealNumberPrecision)$":
    destination: "::"
