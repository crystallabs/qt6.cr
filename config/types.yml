types: # Type rewrite rules
  QString: # Convert QString instances using that:
    converter: Qt::Converter::QString
    crystal_type: String
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QString::fromUtf8(%.ptr, %.size)"
    from_cpp: "qstring_to_crystal(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QAnyStringView: # A view of the Crystal String's UTF-8 bytes, like QString
    converter: Qt::Converter::QString
    crystal_type: String
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QAnyStringView(%.ptr, %.size)"
    from_cpp: "qstring_to_crystal(%.toString())"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QByteArray: # Map as Bytes, exchanged as a {pointer, size} pair like QString
    converter: Qt::Converter::QByteArray
    crystal_type: Bytes
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QByteArray(%.ptr, %.size)"
    from_cpp: "qbytearray_to_crystal(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QByteArrayView: # A view of the Bytes, like QAnyStringView of the String
    converter: Qt::Converter::QByteArray
    crystal_type: Bytes
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QByteArrayView(%.ptr, %.size)"
    from_cpp: "qbytearray_to_crystal(%.toByteArray())"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QChar: # Map as Crystal Char
    cpp_type: int32_t
    binding_type: Int32
    builtin: true
    crystal_type: Char
    to_cpp: "QChar(%)"
    from_cpp: "static_cast<int32_t>(%.unicode())"
    to_crystal: "(%.chr)"
    from_crystal: "(%.ord)"
    kind: Struct
    pass_by: Value
  char32_t: # Map as Crystal Char, like QChar
    binding_type: UInt32
    builtin: true
    crystal_type: Char
    to_crystal: "(%.chr)"
    from_crystal: "(%.ord.to_u32)"
    kind: Struct
    pass_by: Value
  char16_t: # Map as Crystal Char, like char32_t; QTextStream#<< takes it
    binding_type: UInt16
    builtin: true
    crystal_type: Char
    to_crystal: "(%.chr)"
    from_crystal: "(%.ord.to_u16)"
    kind: Struct
    pass_by: Value
  QVariant:
    crystal_type: Variant
    binding_type: CrystalVariant
    cpp_type: CrystalVariant
    from_crystal: "(%.to_unsafe)"
    to_crystal: "Qt::Variant.new(%)"
    from_cpp: "qvariant_to_crystal(%)"
    to_cpp: "crystal_to_qvariant(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
    generate_wrapper: false
    generate_binding: false
  QVariant::DataPtr: { ignore: true }
  "QMetaObject::Connection":
    crystal_type: SignalConnection
    cpp_type: "QMetaObject::Connection"
    binding_type: QMetaObjectConnection
  QSessionManager:
    pass_by: Reference
    from_cpp: "(%)"
  QPoint:
    copy_structure: true
    binding_type: QPoint
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QPointF:
    copy_structure: true
    binding_type: QPointF
    generate_binding: true
    generate_wrapper: true
    crystal_type: PointF
    pass_by: Value
    kind: Struct
  QSize:
    copy_structure: true
    binding_type: QSize
    generate_binding: true
    generate_wrapper: true
    crystal_type: Size
    pass_by: Value
    kind: Struct
    ignore_methods:
      - toCGSize
  QSizeF:
    copy_structure: true
    binding_type: QSizeF
    generate_binding: true
    generate_wrapper: true
    crystal_type: SizeF
    pass_by: Value
    kind: Struct
  QLine:
    copy_structure: true
    binding_type: QLine
    generate_binding: true
    generate_wrapper: true
    crystal_type: Line
    pass_by: Value
    kind: Struct
  QLineF:
    copy_structure: true
    binding_type: QLineF
    generate_binding: true
    generate_wrapper: true
    crystal_type: LineF
    pass_by: Value
    kind: Struct
  QRect:
    copy_structure: true
    binding_type: QRect
    generate_binding: true
    generate_wrapper: true
    crystal_type: Rect
    pass_by: Value
    kind: Struct
  QRectF:
    copy_structure: true
    binding_type: QRectF
    generate_binding: true
    generate_wrapper: true
    crystal_type: RectF
    pass_by: Value
    kind: Struct
  "QPainter::PixmapFragment":
    ignore: true
    # copy_structure: true
    # binding_type: QPainterPixmapFragment
    # generate_binding: false
    # generate_wrapper: false
    # crystal_type: PainterPixmapFragment
    # pass_by: Pointer
  "QAbstractEventDispatcher::TimerInfo":
    binding_type: EventDispatcherTimerInfo
    generate_binding: false
    generate_wrapper: false
    copy_structure: true
    pass_by: Value
    kind: Struct

  "QUrl::FormattingOptions":
    crystal_type: Url::FormattingOptions
    binding_type: Url::FormattingOptions
    kind: Enum
    builtin: true # We provide this type

  # Don't sub-class these
  QImage: { sub_class: false }
  QPixmap: { sub_class: false }
  QIcon: { sub_class: false }

  # Typedefs
  QRgb: { alias_for: "unsigned int" }
  # Qt 6.10+ stores the fields of these as `QCheckedInt<int>`, which is laid
  # out like an `int`.
  "QPoint::Representation": { alias_for: "int" }
  "QSize::Representation": { alias_for: "int" }
  "QRect::Representation": { alias_for: "int" }
  "QPalette::ResolveMask": { alias_for: "quint64" }
  WId: { alias_for: "unsigned int" }
  # bindgen looks through a typedef without rules of its own, like
  # QFileInfoList, QModelIndexList or QVariantList, to the type it names.
  # QStringList is listed as a class (below), so it needs the alias.
  QStringList: { alias_for: "QList<QString>" } # Qt 6 declares it so
  # The methods of QList<QString> itself (wrapped as Qt::StringList) name these.
  "QList<QString>::DataPointer": { ignore: true } # Private storage, data_ptr
  "QList<QString>::iterator": { ignore: true } # Indexes replace the iterators
  "QList<QString>::const_iterator": { ignore: true }
  "QList<QString>::reverse_iterator": { ignore: true }
  "QList<QString>::const_reverse_iterator": { ignore: true }
  "QList<QString>":
    ignore_methods:
      # Qt's operator[] is unchecked (Q_ASSERT only); as a method of the class
      # itself it would shadow Indexable#[], which raises IndexError.
      - "operator[]"

  # Structures with QVariant: Ignore for now.
  "QInputMethodEvent::Attribute": { ignore: true }
  "QList<QInputMethodEvent::Attribute>": { ignore: true }

  "QList<QTextEdit::ExtraSelection>": { ignore: true }
  "QList<QTextOption::Tab>": { ignore: true }
  "QTextOption::Tab": { ignore: true }
  "QFormLayout::TakeRowResult": { ignore: true }

  # Bare struct holding QProcess::UnixProcessFlags and an int (Qt 6.6+).
  "QProcess::UnixProcessParameters": { ignore: true }

  # No support for associative containers yet
  "QMap<int, QVariant>": { ignore: true }
  "QMap<QDate, QTextCharFormat>": { ignore: true } # Use CalendarWidget#date_text_format(date)
  "std::optional<QFont>": { ignore: true } # QFontComboBox#displayFont
  "QHash<int, QByteArray>": { ignore: true }

  # Ignore private data structures
  QObjectPrivate: { ignore: true }
  QKeySequencePrivate: { ignore: true }
  QUrlPrivate: { ignore: true }
  QImageData: { ignore: true }
  QIconPrivate: { ignore: true }
  "QPixmap::DataPtr": { ignore: true }
  "QUrlQuery::DataPtr": { ignore: true }
  "QBrush::DataPtr": { ignore: true }
  QPenPrivate: { ignore: true }

  # QByteArray maps to Bytes; QList<QByteArray> is instantiated in
  # containers.yml, QSet has no mapping yet.
  "QSet<QByteArray>": { ignore: true }

  # Qt 6 types without a mapping yet
  "Qt::Disambiguated_t": { ignore: true } # Overload tag
  "Qt::Initialization": { ignore: true } # Qt::Uninitialized constructor tag
  # std::chrono::nanoseconds maps to ::Time::Span below.  Qt's typedefs of it
  # aren't looked through like a list typedef: the canonical type the parser
  # reports is the std::chrono::duration<...> instantiation, which the
  # nanoseconds rule doesn't name.
  "QElapsedTimer::Duration": { alias_for: "std::chrono::nanoseconds" }
  "QBasicTimer::Duration": { alias_for: "std::chrono::nanoseconds" }
  "QAbstractEventDispatcher::Duration": { alias_for: "std::chrono::nanoseconds" }
  "QVersionNumber::const_iterator": { ignore: true } # Use #segments
  "QVersionNumber::const_reverse_iterator": { ignore: true }
  "QUuid::Id128Bytes": { ignore: true } # A union; use #to_rfc4122 (Bytes)
  quint128: { ignore: true } # unsigned __int128, which the C ABI can't pass
  "std::seed_seq": { ignore: true }
  "QRandomGenerator::System": { ignore: true } # Tag of a protected constructor
  "QAbstractEventDispatcher::TimerInfoV2": { ignore: true }
  "QList<QAbstractEventDispatcher::TimerInfoV2>": { ignore: true }
  "QEvent::InputEventTag": { ignore: true } # Tags of protected constructors
  "QEvent::PointerEventTag": { ignore: true }
  "QEvent::SinglePointEventTag": { ignore: true }
  "std::filesystem::path": { ignore: true }
  "QFont::Tag": { ignore: true }
  "QList<QFont::Tag>": { ignore: true }
  "QTextDocument::ResourceProvider": { ignore: true } # std::function
  "QEasingCurve::EasingFunction": { ignore: true } # C function pointer
  "QPen::DataPtr": { ignore: true }
  "QPointer<QObject>": { ignore: true }
  "QList<QPointer<QObject>>": { ignore: true }

  # String views and matchers: the Crystal String maps to QString, so the
  # overloads taking these would only duplicate the QString ones.
  QStringView: { ignore: true }
  QLatin1StringView: { ignore: true }
  QStringMatcher: { ignore: true }
  QLatin1StringMatcher: { ignore: true }

  # Ignore pure template types
  "QList<T>": { ignore: true }
  "Func1": { ignore: true } # Fake types used in QObject::connect().
  "Func2": { ignore: true }
  "QtPrivate::FunctionPointer<Func1>::Object": { ignore: true }
  "QtPrivate::FunctionPointer<Func2>::Object": { ignore: true }
  "T": { ignore: true }
  "void ()": { ignore: true }
  # The QTextStream manipulators (Qt::endl etc.) are C function pointers;
  # qfloat16 is Qt's half-float class, which has no Crystal counterpart.
  QTextStreamFunction: { ignore: true }
  "QTextStream &(QTextStream &)": { ignore: true }
  QTextStreamManipulator: { ignore: true } # qSetFieldWidth etc., use the setters
  qfloat16: { ignore: true }
  "void (void *)": { ignore: true }
  "std::__1::function<void (const QString &, const QByteArray &)>":
    ignore: true
  "std::function<void (const QString &, const QByteArray &)>":
    ignore: true
  "std::chrono::milliseconds":
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span" # Qt::Time shadows Time inside module Qt
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::milliseconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpan
  "std::chrono::nanoseconds": # Like milliseconds; QChronoTimer, QBasicTimer
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span"
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::nanoseconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpanNanoseconds
  "std::chrono::seconds": # Like milliseconds; QTimeZone.from_duration_ahead_of_utc
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span"
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::seconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpanSeconds
  CGRect: {ignore: true} # Apple types Qt exposes on macOS
  CGSize: {ignore: true}
  CGPoint: {ignore: true}
  CGImage: {ignore: true}
  NSMenu: {ignore: true}
  CFURLRef: {ignore: true}
  NSURL: {ignore: true}
  __CFDate: {ignore: true} # QDateTime#toCFDate, named invalidly for Crystal
  NSDate: {ignore: true}
  __CFUUID: {ignore: true} # QUuid#toCFUUID
  NSUUID: {ignore: true}
  __CFTimeZone: {ignore: true} # QTimeZone#toCFTimeZone
  NSTimeZone: {ignore: true}
  QDateTime:
    ignore_methods:
      # Returns std::chrono::milliseconds, whose from_cpp rule bindgen applies
      # to the right operand only: `(a - (b).count())`.  Use msecs_to instead.
      - "operator-"
  QSettings:
    ignore_methods:
      - registerFormat # Takes C function pointers over QMap<QString, QVariant>
  # bindgen's virtual_override copies the virtual parent, columnCount and
  # hasChildren of QAbstractItemModel into QStringListModel's override class:
  # its private_override? only looks at the class itself, not at
  # QAbstractListModel in between, which made them private, so the generated
  # C++ doesn't compile.  Subclass AbstractListModel instead.
  QStringListModel: { sub_class: false }
  # bindgen can't pass a QString (the Crystal String, by value) by non-const
  # reference, so it drops QValidator::validate and fixup: the helpers in
  # ext/validator_helper.hpp call them, see src/qt6/validator.cr.  As validate
  # is pure virtual, a subclass from Crystal would stay abstract in C++.
  QValidator: { sub_class: false }
  QHeaderView:
    ignore_methods:
      # bindgen wraps Qt's protected `initialize()` under that name, which
      # Crystal reserves for constructors, so the wrapper doesn't compile.
      - initialize
  QPolygon:
    ignore_methods: # Variadic, which can't be wrapped
      - setPoints
      - putPoints

  # Painting and geometry.  The small value classes are copied structures,
  # passed by value like QPoint.  (Each rule is spelled out: bindgen keeps
  # per-type state in the rule, so a YAML alias would share it.)
  QVector2D:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QVector3D:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QVector4D:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QQuaternion:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QQuaternion::Axis":
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QQuaternion::Axes":
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QRgba64:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QPainterPath::Element": # Field accessors in src/qt6/copied_fields.cr
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QPageRanges::Range": # Field accessors in src/qt6/copied_fields.cr
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QColorSpace::PrimaryPoints":
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QQuaternion::EulerAngles<float>": { ignore: true } # Template; use #get_euler_angles
  # A typedef of QGenericMatrix<3, 3, float>, a template bindgen can't
  # instantiate; drops Matrix4x4#normal_matrix and Quaternion#to_rotation_matrix.
  QMatrix3x3: { ignore: true }
  "QGradient::QGradientData": { ignore: true } # Private union
  "QRegion::QRegionData": { ignore: true } # Private
  "QRegion::const_iterator": { ignore: true } # Use #rect_count and #bounding_rect
  "QRegion::const_reverse_iterator": { ignore: true }
  "QPicture::DataPtr": { ignore: true }
  # Text and fonts
  QTextFrameLayoutData: { ignore: true } # Private layout data of QTextFrame
  QTextDocumentPrivate: { ignore: true } # Private; drops a QTextFragment constructor
  QTextEngine: { ignore: true } # Private; drops TextLayout#engine
  # Events, devices and input
  QKeyCombination: # An int
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QPointingDeviceUniqueId: # A qint64
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QCalendar::YearMonthDay": # Three ints; field accessors in src/qt6/copied_fields.cr
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QtPrivate::QKeyValueRange<QJsonObject &>": { ignore: true } # Use #keys and #value
  # QDataStream's friend operators name these, which have no mapping.
  "QTransform::Affine": { ignore: true } # Private
  "QGenericMatrix<N, M, T>": { ignore: true } # Template
  "QRangeModelAdapter<type-parameter-0-0, type-parameter-0-1, type-parameter-0-2>::DataReference": { ignore: true }
  "QRangeModelAdapter<type-parameter-0-0, type-parameter-0-1, type-parameter-0-2>::RowReference": { ignore: true }
  Reference: { ignore: true } # The parser's name for a friend's QRangeModelAdapter::Reference
  "std::nullptr_t": { ignore: true } # QDataStream >> nullptr_t; emitted as invalid Crystal otherwise
  QTypeRevision: { ignore: true }
  QCborValue: { ignore: true } # The CBOR classes aren't bound
  QCborArray: { ignore: true }
  QCborMap: { ignore: true }
  QCborSimpleType: { ignore: true }
  QVariantMap: { ignore: true } # No support for associative containers yet
  QVariantHash: { ignore: true }
  QJsonObjectKeyValues: { ignore: true } # Private
  "QJsonObject::iterator": # Returned by QJsonObject#insert
    ignore_methods:
      - "operator->" # bindgen aborts on it: `Unexpected operator "operator->"`
  "QJsonObject::const_iterator": { ignore: true } # Use #keys and #value
  "QJsonObject::key_value_iterator": { ignore: true }
  "QJsonObject::const_key_value_iterator": { ignore: true }
  "QJsonArray::iterator": { ignore: true } # Use #at and #size
  "QJsonArray::const_iterator": { ignore: true }
  QJsonValueConstRef:
    ignore_methods: # Protected helpers whose argument Qt names `self`, which
      - concrete     # bindgen emits as a Crystal parameter name (invalid)
      - concreteBool
      - concreteDouble
      - concreteInt
      - concreteString
      - concreteStringView
      - concreteType
      - objectKey
      - objectKeyView
  "std::initializer_list<std::pair<QString, QJsonValue>>": { ignore: true }
  "std::initializer_list<QJsonValue>": { ignore: true }
  "QXmlStreamReader::PrivateConstructorTag": { ignore: true }
  QBitRef: { ignore: true } # Returned by the non-const operator[]; use #set_bit
  "QBitArray::DataPtr": { ignore: true }
  QFunctionPointer: { ignore: true } # QLibrary#resolve
  "QLoggingCategory::CategoryFilter": { ignore: true } # C function pointer
  "QLoggingCategory::AtomicBools": { ignore: true } # Private
  "QRegularExpressionMatchIteratorRangeBasedForIterator": { ignore: true } # Qt::RegularExpressionMatchIterator is an Iterator
  QTransform:
    ignore_methods:
      # Private, with a deduced (`auto`) return type the parser reports as the
      # unqualified `Affine`, which no type rule matches.
      - asAffineMatrix
      # bindgen renders its `bool *invertible = nullptr` default as `true`,
      # which doesn't compile: ext/matrix_helper.hpp, src/qt6/transform.cr.
      - inverted
  QMatrix4x4:
    ignore_methods:
      - inverted # Like QTransform::inverted
  "QPixmapCache::KeyData": { ignore: true } # Private
  <<+: keep_alive.yml # Deep merge: adds `keep_alive` to classes listed above
