# This is the binding configuration for Qt6.
# Targeted version: Qt 6.4 and later
# Main Page: https://www.qt.io/
# C++ Documentation: https://doc.qt.io/qt-6/index.html
#
# Please take note of Qts own license at:
#   https://doc.qt.io/qt-6/licensing.html
# Also see the license of THE BINDINGS in the LICENSE file.
#
# These bindings will, as configured, bind to Qt dynamically.

module: Qt

# Drop the API Qt deprecated after 6.8, overload by overload.  The API
# deprecated up to 6.8 is hidden by QT_DISABLE_DEPRECATED_BEFORE below.
ignore_deprecated: true
# A method returning a pointer to a wrapped class returns nil for a null
# pointer, so its result is `T?`: Widget#parent_widget, ListWidget#item.  See
# "Null pointers" in the README.
nilable_results: true
if_os_is_darwin:
  library: "%/ext/binding_{BINDING_PLATFORM}.a -lstdc++ `pkg-config --libs Qt6Widgets` -lgccpp"
else:
  library: "%/ext/binding_{BINDING_PLATFORM}.a -lstdc++ -lQt6Core -lQt6Gui -lQt6Widgets -lgccpp"

<<: config/processors_and_generators.yml
<<: config/find_paths.yml
<<: config/classes.yml
<<: config/enums.yml
<<: config/macros.yml
<<: config/functions.yml
<<: config/containers.yml
<<: config/types.yml

parser: # Clang parser configuration
  if_TARGET_TRIPLE_is_: # TARGET_TRIPLE is empty.
    flags:
      - "-x"
      - "c++"
      - "-std=c++17"
      - "-fPIC"
      # Hide the APIs Qt deprecated up to 6.8.  Must match `ext/Makefile`.
      # Qt 6.5+ calls this QT_DISABLE_DEPRECATED_UP_TO, but still reads the old
      # name, which Qt before 6.5 only knows.
      - "-DQT_DISABLE_DEPRECATED_BEFORE=0x060800"
      # Qt built as macOS frameworks keeps its headers in the frameworks.
      - "-F{QT_LIBS_DIR}"
  else:
    flags:
      - "-x"
      - "c++"
      - "-stdlib=libc++"
      - "-std=c++17"
      - "-fPIC"
      - "-DQT_DISABLE_DEPRECATED_BEFORE=0x060800"
      - "-F{QT_LIBS_DIR}"
      - "-target"
      - "{TARGET_TRIPLE}"
  files:
    - QtCore/QtCore
    - QtGui/QtGui
    - QtWidgets/QtWidgets
    - "locale_helper.hpp"
    - "validator_helper.hpp"
    - "matrix_helper.hpp"
    - "xml_helper.hpp"
    - "meta_helper.hpp"
  includes:
    - "{QT_INCLUDE_DIR}/"
    - "{QT_INCLUDE_DIR}/QtCore/"
    - "{QT_INCLUDE_DIR}/QtGui/"
    - "{QT_INCLUDE_DIR}/QtWidgets/"
    - "{EXT_INCLUDES}"
