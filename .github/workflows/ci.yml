name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bindings:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported Qt range: Ubuntu's Qt 6.4 with the oldest
        # LLVM bindgen supports and with Ubuntu's default, and Homebrew's
        # current Qt.  Qt hides API it removed in later versions, so a binding
        # that generates against one end can still fail against the other.
        include:
          - name: Ubuntu 24.04 Qt 6.4, LLVM 14
            os: ubuntu-24.04
            llvm: 14
            llvm_dir: /usr/lib/llvm-14/lib/cmake/llvm
          - name: Ubuntu 24.04 Qt 6.4, LLVM 18
            os: ubuntu-24.04
            llvm: 18
            llvm_dir: /usr/lib/llvm-18/lib/cmake/llvm
          - name: macOS Homebrew Qt
            os: macos-15
            llvm_dir: /opt/homebrew/opt/llvm/lib/cmake/llvm
    env:
      LLVM: ${{ matrix.llvm }}
      LLVM_DIR: ${{ matrix.llvm_dir }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      # install-crystal installs packages without refreshing the package
      # index, which fails when the runner image's index has gone stale.
      - name: Update package index
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - uses: crystal-lang/install-crystal@v1

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools libgc-dev \
            "clang-$LLVM" "libclang-$LLVM-dev" "libclang-cpp$LLVM-dev" "llvm-$LLVM-dev" \
            cmake libpcre2-dev libyaml-dev libevent-dev \
            libxml2-dev libz3-dev libzstd-dev zlib1g-dev libncurses-dev

      # Homebrew's Qt is built as frameworks, see the README's macOS section.
      # Homebrew's LLVM static libraries hold bitcode newer than the runner's
      # Xcode linker reads, so bindgen's parser links LLVM dynamically.
      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt bdw-gc llvm cmake pkgconf
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CPPFLAGS=-I/opt/homebrew/include"
            echo "LIBRARY_PATH=/opt/homebrew/lib"
            echo "PKG_CONFIG_PATH=/opt/homebrew/opt/qt/lib/pkgconfig"
            echo "BINDGEN_DYNAMIC=1"
          } >> "$GITHUB_ENV"

      - name: Install shards
        run: shards install

      # src/qt6/binding/ holds the generated bindings, which aren't formatted.
      - name: Check formatting
        run: crystal tool format --check src/qt6.cr src/qt6/*.cr spec samples support

      - name: Build clang tool
        working-directory: lib/bindgen/clang
        run: cmake -DLLVM_DIR="$LLVM_DIR" . && make

      - name: Detect binding platform
        run: |
          detected="$(crystal run support/decide_binding_slow.cr -- 6.0.0)"
          echo "BINDING_PLATFORM=${detected#* }" >> "$GITHUB_ENV"

      # Deprecated Qt API is hidden by QT_DISABLE_DEPRECATED_BEFORE, or dropped
      # by bindgen's ignore_deprecated.  A warning means one of them failed.
      - name: Generate bindings
        run: |
          set -o pipefail
          lib/bindgen/tool.sh qt.yml --stats 2>&1 | tee generate.log
          if grep "is deprecated" generate.log; then
            echo "::error::The bindings use deprecated Qt API, see above."
            exit 1
          fi

      # The bindings for the CI platforms are committed, so users don't need
      # bindgen's dependencies.  When this warns, download the artifact and
      # commit its files.
      - name: Check the committed binding
        run: |
          if [ -n "$(git status --porcelain -- src/qt6/binding ext)" ]; then
            echo "::warning::The committed binding for $BINDING_PLATFORM is missing or out of date, see the binding-$BINDING_PLATFORM artifact."
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.llvm != 14
        with:
          name: binding-${{ env.BINDING_PLATFORM }}
          path: |
            src/qt6/binding/binding_${{ env.BINDING_PLATFORM }}.cr
            ext/qt_binding_${{ env.BINDING_PLATFORM }}.cpp

      - name: Run specs
        run: crystal spec

      - name: Build samples
        run: |
          mkdir -p bin
          for sample in samples/*.cr; do
            crystal build "$sample" -o "bin/$(basename "$sample" .cr)"
          done
